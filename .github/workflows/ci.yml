name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start local Supabase
        run: supabase start

      # The test fixtures assume the seed data from the current migrations.
      # Resetting here affects only the runner's disposable local database and
      # prevents a reused volume from changing the test outcome.
      - name: Reset local database fixtures
        run: supabase db reset --local

      - name: Verify tracked secrets
        run: npm run verify:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Run database tests
        run: npm run test:db

      - name: Build production application
        run: npm run build
