name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked secrets
        run: npm run verify:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Run database tests
        run: npm run test:db

      - name: Build production application
        run: npm run build

  concurrency-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hold capacity and quota races (isolated local fixtures)
        run: npm run test:hold-concurrency
      - name: Berth assignment race (isolated local fixtures)
        run: npm run test:assignment-concurrency

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Playwright with generated local users and isolated Supabase
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-gate:
    needs: [verify, concurrency-tests, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every pilot verification job to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CONCURRENCY_RESULT: ${{ needs.concurrency-tests.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$CONCURRENCY_RESULT" = success
          test "$E2E_RESULT" = success
